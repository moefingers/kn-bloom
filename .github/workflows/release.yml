name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # pnpm version comes from package.json `packageManager`. Installs
      # Node 24 and runs `pnpm install --frozen-lockfile` in the same step.
      # Pinned exactly: `require-lockfile` landed in v2.1.0 and the floating
      # `v2` tag still points at v2.0.2, which ignores it. Move back to `v2`
      # once upstream advances the tag.
      - uses: pnpm/setup@v2.1.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag $TAG matches package.json version."

      - run: pnpm check

      - run: pnpm build

      # The build already refuses to emit a file with remote references;
      # this only proves the file exists and names the released asset.
      - name: Verify build artifact exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html missing after build"
            exit 1
          fi
          SIZE=$(stat -c%s dist/index.html)
          echo "dist/index.html size: $SIZE bytes"
          cp dist/index.html dist/kn-bloom.html

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            dist/kn-bloom.html
